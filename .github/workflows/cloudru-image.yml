name: Build Cloud.ru container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0b96c-accessibilitymap

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:cloudru-demo
          cache-from: type=gha
          cache-to: type=gha,mode=max

  authorized-load-test:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[load-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz -o /tmp/k6.tgz
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo install /tmp/k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Warm up authorized Render service
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 10 --max-time 120 https://accessibilitymap-5deb.onrender.com/health
      - name: Run staged read-only test (1, 10, 100, 1000)
        env:
          TARGET_URL: https://accessibilitymap-5deb.onrender.com
        run: |
          set +e
          for stage in 1 10 100 1000; do
            echo "===== LOAD STAGE: $stage concurrent users ====="
            LOAD_STAGE="$stage" k6 run --summary-export="load-$stage.json" tests/load/read-only.js 2>&1 | tee "load-$stage.txt"
            result=${PIPESTATUS[0]}
            if [[ -f "load-$stage.json" ]]; then
              python3 tests/load/summarize.py "$stage" "load-$stage.json"
            else
              echo "::error title=Load test $stage users::k6 did not produce a summary (exit $result)"
            fi
          done
          exit 0
      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-render-load-test-results
          path: load-*.*
          retention-days: 14
